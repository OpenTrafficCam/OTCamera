---
debug_mode: false

relay_server: false

recording:
  start_hour: 6
  end_hour: 22
  interval_length: 15
  num_intervals: 0
  min_free_space: 1

camera:
  fps: 20
  resolution:
    width: 1640
    height: 1232
  exposure_mode: nightpreview
  drc_strength: high
  rotation: 180
  awb_mode: greyworld
  meter_mode: average

preview:
  path: ~/OTCamera/webfiles/preview.jpg
  format: jpeg
  interval: 5
  send_to_external: false
  url: http://your-server:8080/projects/0/sites/1/cameras/2/current_frame

# Upload backend selector. Only one backend can be active at a time.
# Set to "ftp" or "s3" to enable upload, or leave empty to disable.
upload:

# Notification backend selector. Set to "rabbitmq" to enable, or leave empty.
notification:

# RabbitMQ connection and exchange settings.
# Required when notification: rabbitmq is set.
rabbitmq:
  # Hostname or IP address of the RabbitMQ broker.
  host: 127.0.0.1
  # AMQP port (default: 5672).
  port: 5672
  # Broker credentials.
  user: guest
  password: guest
  # Virtual host to connect to.
  vhost: /
  # Exchange to publish messages to. Use "" for the default exchange.
  exchange: ""
  # Exchange type: direct, fanout, topic, or headers.
  exchange_type: direct
  # Routing key used when publishing messages.
  routing_key: ""
  # Whether the exchange and messages survive broker restarts.
  durable: true

# OTCloud camera identity used in upload notification payloads.
# Required when notification: rabbitmq is set.
ot_cloud:
  camera_id: 0
  project_id: 0
  site_id: 0

# Providing ftp_upload credentials does not enable upload on its own.
# Set upload: ftp above to activate FTP upload.
ftp_upload:
  host:
  port: 21
  user:
  password:
  server_source: /

# Providing s3_upload credentials does not enable upload on its own.
# Set upload: s3 above to activate S3 upload.
s3_upload:
  access_key:
  secret_key:
  bucket:
  region:
  endpoint_url:
  # Number of retry attempts for failed S3 requests.
  retry_max_attempts: 5
  # Seconds to wait when establishing a connection to S3.
  connect_timeout: 10
  # Seconds to wait for a response from S3 after sending a request.
  read_timeout: 30
  # Optional prefix prepended to the S3 object key, e.g. "project/site/camera".
  key_prefix: ""

# Delete local video files after a successful upload.
delete_after_upload: false

# Seconds to wait for in-flight uploads to finish when shutting down.
upload_grace_timeout: 60

video:
  dir: ~/videos/
  format: h264
  resolution:
    width: 800
    height: 600
  encoder:
    profile: high
    level: 4
    bitrate: 600000
    quality: 30

wifi:
  delay: 900

hardware:
  pcb_version: v2
  use_leds: false
  use_buttons: false
  use_adc: false

msteams:
  enable: false
  url: null
  max_failed_send_attempts: 2

adc:
  threshold_external_power: 2.5
  threshold_low_battery: 3.3
