---
debug_mode: false

recording:
  start_hour: 6
  end_hour: 22
  interval_length: 15
  num_intervals: 0
  min_free_space: 1
  min_free_space_margin: 1

camera:
  fps: 20
  resolution:
    width: 2304
    height: 1296
  exposure_mode: nightpreview
  drc_strength: high
  rotation: 180
  awb_mode: greyworld
  meter_mode: average

preview:
  path: ~/OTCamera/webfiles/preview.jpg
  format: jpeg
  interval: 5
  send_to_external: false
  url: http://localhost:5000/projects/0/sites/1/cameras/2/current_frame

upload:

# Notification backend selector. Set to "rabbitmq" to enable, or leave empty.
notification:

rabbitmq:
  host: 127.0.0.1
  port: 5672
  user: guest
  password: guest
  vhost: /
  exchange: otcamera
  exchange_type: direct
  routing_key: file_uploaded
  queue_name: otcamera_uploads
  durable: true

ot_cloud:
  camera_id: 0
  project_id: 0
  site_id: 0

ftp_upload:
  host: localhost
  port: 21
  user: user
  password: password
  server_source: /

s3_upload:
  access_key:
  secret_key:
  bucket:
  region:
  endpoint_url:
  connect_timeout: 10
  read_timeout: 30
  key_prefix: ""

upload_grace_timeout: 60

video:
  # Finished videos are moved into <dir>/pending and stay there until they
  # have been uploaded. A camera with no upload backend keeps them there.
  dir: ~/videos/
  format: h264
  resolution:
    width: 800
    height: 600
  encoder:
    profile: high
    level: 4
    bitrate: 600000
    quality: 30

hardware:
  pcb_version: v2
  use_leds: false
  use_buttons: false
  use_adc: false

wifi:
  delay: 900

adc:
  threshold_external_power: 2.5
  threshold_low_battery: 3.3
  battery_read_interval: 10
