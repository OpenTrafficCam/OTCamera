<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <!-- Reload the whole page every 5s. The preview image is served with
             Cache-Control: no-cache (see nginx config), so the browser
             revalidates and only re-downloads it when it actually changed. -->
        <meta content="5" http-equiv="refresh" />
        <title>OTCamera</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
            }
            img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
            }
        </style>
    </head>
    <body>
        <img alt="OTCamera preview" src="preview.jpg" />
    </body>
</html>
