[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "OTCamera"
dynamic = ["dependencies", "version"]
authors = [
    { name="OpenTrafficCam contributors", email="team@opentrafficcam.org" },
    { name="platomo GmbH", email="info@platomo.de" },
]
description = "OTCamera is a core module of the OpenTrafficCam framework to record videos over multiple days with a custom camera system based on the Raspberry Pi Zero W."

readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
keywords = ["OpenTrafficCam", "Mobile Camera"]

[project.urls]
Homepage = "https://opentrafficcam.org/"
Documentation = "https://opentrafficcam.org/overview/"
Repository = "https://github.com/OpenTrafficCam/OTCamera"
Issues = "https://github.com/OpenTrafficCam/OTCamera/issues"
Changelog = "https://github.com/OpenTrafficCam/OTCamera/releases"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.version]
path = "OTCamera/version.py"

[tool.hatch.build.targets.wheel]
packages = ["OTCamera"]

[tool.hatch.build]
directory = "dist"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
line_length = 88
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require external services (e.g. a running S3 server)",
]

[tool.mypy]
ignore_missing_imports = false
disallow_untyped_defs = true
exclude = [
    "^venv/",
]

[[tool.mypy.overrides]]
module = "OTCamera.html_updater"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.html_updater_test"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "libcamera",
    "gpiozero",
    "gpiozero.pins.lgpio",
    "jmespath",
    "picamera2",
    "picamera2.encoders",
    "picamera2.outputs"
]  # explicitly empty — populated only via deliberate user decisions
ignore_missing_imports = true # needs to set to true to take effect on the whitelisted modules

[tool.ruff.lint]
# Enable all `pydocstyle` rules, limiting to those that adhere to the
# Google convention via `convention = "google"`, below.
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
