[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[project]
name = "OTCamera"
dynamic = ["version"]
authors = [
    { name="OpenTrafficCam contributors", email="team@opentrafficcam.org" },
    { name="platomo GmbH", email="info@platomo.de" },
]
description = "OTCamera is a core module of the OpenTrafficCam framework to record videos over multiple days with a custom camera system based on the Raspberry Pi Zero W."
dependencies = [
    "beautifulsoup4==4.13.4",
    "boto3==1.42.85",
    "pydantic==2.12.5",
    "psutil==7.0.0",
    "PyYAML==6.0.2",
    "requests>=2.32.3",

    # pi-specific dependencies, exclude other systems via markers.
    "gpiozero==2.0.1; sys_platform == 'linux' and platform_machine in 'armv6l armv7l'",
    "lgpio==0.2.2.0; sys_platform == 'linux' and platform_machine in 'armv6l armv7l'",
    "opencv-python-headless==4.12.0.88; sys_platform == 'linux' and platform_machine in 'armv6l armv7l'",
    "smbus2==0.6.1; sys_platform == 'linux' and platform_machine in 'armv6l armv7l'",
]

readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["OpenTrafficCam", "Mobile Camera"]

[project.urls]
Homepage = "https://opentrafficcam.org/"
Documentation = "https://opentrafficcam.org/overview/"
Repository = "https://github.com/OpenTrafficCam/OTCamera"
Issues = "https://github.com/OpenTrafficCam/OTCamera/issues"
Changelog = "https://github.com/OpenTrafficCam/OTCamera/releases"

[tool.hatch.version]
path = "OTCamera/version.py"

[tool.hatch.build.targets.wheel]
packages = ["OTCamera"]

[tool.hatch.build]
directory = "dist"

[dependency-groups]
dev = [
    "mypy>=2.0,<3",
    "pre-commit>=4.2.0,<5",
    "pytest>=9.0,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.15.12",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
line_length = 88
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
ignore_missing_imports_per_module = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "OTCamera.html_updater"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.html_updater_test"
ignore_errors = true

[tool.uv]
default-groups = []
exclude-newer = "3 days"
