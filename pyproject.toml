[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[project]
name = "OTCamera"
dynamic = ["version"]
authors = [
    { name="OpenTrafficCam contributors", email="team@opentrafficcam.org" },
    { name="platomo GmbH", email="info@platomo.de" },
]
description = "OTCamera is a core module of the OpenTrafficCam framework to record videos over multiple days with a custom camera system based on the Raspberry Pi Zero W."
dependencies = [
    "beautifulsoup4==4.13.4",
    "boto3==1.42.85",
    "pika==1.3.2",
    "pydantic==2.12.5",
    "psutil==7.0.0",
    "PyYAML==6.0.2",
    "requests==2.32.4",
]

readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["OpenTrafficCam", "Mobile Camera"]

[project.optional-dependencies]
# pi-specific dependencies
pi = [
    "gpiozero==2.0.1",
    "lgpio==0.2.2.0",
    "opencv-python-headless==4.12.0.88",
    "smbus2==0.6.1",
]

[project.urls]
Homepage = "https://opentrafficcam.org/"
Documentation = "https://opentrafficcam.org/overview/"
Repository = "https://github.com/OpenTrafficCam/OTCamera"
Issues = "https://github.com/OpenTrafficCam/OTCamera/issues"
Changelog = "https://github.com/OpenTrafficCam/OTCamera/releases"

[project.scripts]
otc-netwatch = "OTCamera.netwatch.__main__:main"

[tool.hatch.version]
path = "OTCamera/version.py"

[tool.hatch.build.targets.wheel]
packages = ["OTCamera"]

[tool.hatch.build]
directory = "dist"

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-cov>=7.1.0",
    "ruff==0.15.12",
    "types-boto3==1.42.85",
    "types-pika-ts==1.3.0.*",
    "types-psutil==7.0.0.*",
    "types-PyYAML==6.0.2",
    "types-requests==2.32.4.*",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require external services (e.g. a running S3 server)",
]

[tool.mypy]
ignore_missing_imports = false
disallow_untyped_defs = true
exclude = [
    "^venv/",
]

[[tool.mypy.overrides]]
module = "OTCamera.html_updater"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.html_updater_test"
ignore_errors = true

[tool.uv]
default-groups = []
exclude-newer = "3 days"

[[tool.mypy.overrides]]
module = [
    "libcamera",
    "gpiozero",
    "gpiozero.pins.lgpio",
    "jmespath",
    "picamera2",
    "picamera2.encoders",
    "picamera2.outputs",
    "smbus2",
    "cv2",
]  # explicitly empty — populated only via deliberate user decisions
ignore_missing_imports = true # needs to set to true to take effect on the whitelisted modules

[tool.ruff.lint.pydocstyle]
convention = "google"

# Exclude tests/ from being docstyle-linted
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.isort]
line_length = 88
profile = "black"
