---
name: test

on:
  # Run on each PR, and allow other workflows (e.g. release) to call this one.
  pull_request:
  workflow_call:

permissions: read-all

jobs:
  test-unit:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # setup-uv publishes no floating major tag, so this must be an exact pin.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Separate from the test step so a stale uv.lock fails loudly and early.
      - name: Install dependencies
        run: uv sync --locked --dev

      # `just` comes from PyPI via uv rather than a dedicated action: one less
      # third-party action, and it keeps the job runnable under `act`.
      - name: Run tests
        run: uvx --from rust-just@1.58.0 just test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f container/compose.yml logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose -f container/compose.yml down -v
